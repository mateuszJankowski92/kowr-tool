services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: kowr
      POSTGRES_USER: kowr
      POSTGRES_PASSWORD: kowr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kowr -d kowr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
